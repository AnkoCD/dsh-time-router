name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The plugin has zero runtime dependencies, so there is nothing to install.
      - name: Syntax-check every JavaScript file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)

      - name: Run each test file
        run: |
          set -euo pipefail
          for f in test/*.test.js; do
            echo "== $f"
            node "$f"
          done
